version = 2

[review]
max_commits = 10

[llm]
default_provider = "mistral"
default_model = "mistral-medium-3.5"
max_iterations = 3

# Per-stage overrides. Any omitted stage uses `[llm].max_iterations`.
[stages.quality]
max_iterations = 10

[stages.security]
max_iterations = 5

[stages.knowledge]
max_iterations = 10

[stages.commit_scope]
max_iterations = 10

[stages.commit_sequence]
max_iterations = 10
