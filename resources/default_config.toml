version = 1

[review]
max_commits = 10

[llm]
default_provider = "mistral"
max_iterations = 3

# Per-check overrides. Any omitted check uses `[llm].max_iterations`.
[checks.quality]
max_iterations = 10

[checks.security]
max_iterations = 5

[checks.coherence]
max_iterations = 10

[[providers]]
name = "mistral"
api_key_env = "MISTRAL_API_KEY"
default_model = "mistral-medium-3-5"

  # Mistral Large 3 (2025-12 release): general-purpose flagship
  [[providers.models]]
  name = "mistral-large-2512"
  input_per_1m_usd = 0.5
  output_per_1m_usd = 1.5

  # Mistral Medium 3.5 (2026-04 release): agentic and coding workloads
  [[providers.models]]
  name = "mistral-medium-3-5"
  input_per_1m_usd = 1.5
  output_per_1m_usd = 7.5

  # Mistral Small 4 (2026-03 release): low-cost coding and reasoning
  [[providers.models]]
  name = "mistral-small-2603"
  input_per_1m_usd = 0.15
  output_per_1m_usd = 0.6

[[providers]]
name = "openai"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-5.6-luna"

  # GPT-5.6 Sol: frontier model for complex professional work
  [[providers.models]]
  name = "gpt-5.6-sol"
  input_per_1m_usd = 5.0
  output_per_1m_usd = 30.0

  # GPT-5.6 Terra: balances intelligence and cost
  [[providers.models]]
  name = "gpt-5.6-terra"
  input_per_1m_usd = 2.5
  output_per_1m_usd = 15.0

  # GPT-5.6 Luna: optimized for cost-sensitive workloads
  [[providers.models]]
  name = "gpt-5.6-luna"
  input_per_1m_usd = 1.0
  output_per_1m_usd = 6.0

[[providers]]
name = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-5"

  # Claude Sonnet 5: balanced default for coding and agentic reviews
  [[providers.models]]
  name = "claude-sonnet-5"
  input_per_1m_usd = 2.0
  output_per_1m_usd = 10.0

  # Claude Opus 4.8: highest-capability option for complex reasoning
  [[providers.models]]
  name = "claude-opus-4-8"
  input_per_1m_usd = 5.0
  output_per_1m_usd = 25.0

[[providers]]
name = "gemini"
api_key_env = "GEMINI_API_KEY"
default_model = "gemini-3.5-flash"

  # Gemini 3.5 Flash: fast frontier model for code review
  [[providers.models]]
  name = "gemini-3.5-flash"
  input_per_1m_usd = 1.5
  output_per_1m_usd = 9.0

  # Gemini 3.1 Pro Preview: highest-capability Gemini option (preview)
  [[providers.models]]
  name = "gemini-3.1-pro-preview"
  input_per_1m_usd = 2.0
  output_per_1m_usd = 12.0
