version = 2

[review]
max_commits = 10

[llm]
default_provider = "mistral"
default_model = "mistral-medium-3.5"
max_iterations = 3

# Per-check overrides. Any omitted check uses `[llm].max_iterations`.
# The coherence limit also applies to the commit-scope and commit-sequence stages.
[checks.quality]
max_iterations = 10

[checks.security]
max_iterations = 5

[checks.coherence]
max_iterations = 10
