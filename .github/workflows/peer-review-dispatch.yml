name: Peer Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: number
      provider:
        description: LLM provider.
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - google
          - mistral
      model:
        description: Optional model override. Leave empty to use Peer Review's default for the selected provider.
        required: false
        default: ""
        type: string
      no_resume:
        description: Start stages without resuming cached checkpoints.
        required: false
        default: false
        type: boolean
      trace:
        description: Enable peer trace logging.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PEER_VERSION: "0.15.1"

jobs:
  review:
    name: Peer review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate inputs and load pull request
        id: review
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(${{ toJSON(inputs.pr_number) }});
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('pr_number must be a positive integer.');
              return;
            }

            const provider = ${{ toJSON(inputs.provider) }};
            const defaultModels = {
              openai: 'gpt-5.6-terra',
              anthropic: 'claude-sonnet-5',
              google: 'gemini-3.6-flash',
              mistral: 'mistral-medium-latest',
            };
            if (!Object.hasOwn(defaultModels, provider)) {
              core.setFailed(`Unsupported provider: ${provider}`);
              return;
            }

            const requestedModel = (${{ toJSON(inputs.model) }} ?? '').trim();
            const model = requestedModel || defaultModels[provider];

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', pull.head.sha);
            core.setOutput('provider', provider);
            core.setOutput('model', model);

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.review.outputs.head-sha }}
          fetch-depth: 0

      - name: Checkout peer actions
        uses: actions/checkout@v7
        with:
          repository: sgkim126/peer
          ref: ${{ github.workflow_sha }}
          path: .peer-action

      - name: Review and publish with peer
        id: peer
        uses: ./.peer-action/.github/actions/peer-review
        with:
          version: ${{ env.PEER_VERSION }}
          provider: ${{ steps.review.outputs.provider }}
          model: ${{ steps.review.outputs.model }}
          no-resume: ${{ inputs.no_resume }}
          cache-key: peer-cache-${{ runner.os }}-${{ github.repository }}-pr-${{ steps.review.outputs.pr-number }}
          pr-number: ${{ steps.review.outputs.pr-number }}
          repo: ${{ github.repository }}
          trace: ${{ inputs.trace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload peer review stderr
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peer-review-stderr
          path: |
            ${{ steps.peer.outputs.review-stderr-path }}
            ${{ steps.peer.outputs.render-stderr-path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Add peer review summary
        if: always()
        uses: actions/github-script@v9
        env:
          REVIEW_PR_NUMBER: ${{ steps.review.outputs.pr-number }}
          REVIEW_PROVIDER: ${{ steps.review.outputs.provider }}
          REVIEW_MODEL: ${{ steps.review.outputs.model }}
          REVIEW_EXIT_CODE: ${{ steps.peer.outputs.review-exit-code }}
          RENDER_EXIT_CODE: ${{ steps.peer.outputs.render-exit-code }}
          RENDER_STDOUT_PATH: ${{ steps.peer.outputs.render-stdout-path }}
          REVIEW_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require('fs');
            const reviewExitCode = process.env.REVIEW_EXIT_CODE;
            const renderExitCode = process.env.RENDER_EXIT_CODE;
            const exitCode = reviewExitCode !== '0' ? reviewExitCode : renderExitCode;
            const metadata = [
              `peer version: ${process.env.PEER_VERSION}`,
              `provider: ${process.env.REVIEW_PROVIDER || 'unknown'}`,
              `model: ${process.env.REVIEW_MODEL || 'unknown'}`,
              `review exit code: ${reviewExitCode || 'unknown'}`,
              `render exit code: ${renderExitCode || 'unknown'}`,
              `Triggered by @${process.env.REVIEW_TRIGGERING_ACTOR}`,
            ];
            let output = '';
            if (process.env.RENDER_STDOUT_PATH) {
              try {
                output = fs.readFileSync(process.env.RENDER_STDOUT_PATH, 'utf8').trim();
              } catch (error) {
                core.warning(`Could not read peer publication output: ${error.message}`);
              }
            }

            const status = exitCode === '0'
              ? '✅ peer review completed.'
              : `❌ peer review failed (exit code: ${exitCode || 'unknown'}).`;
            const summary = core.summary.addHeading('Peer Review');
            if (process.env.REVIEW_PR_NUMBER) {
              summary.addLink(
                `Pull request #${process.env.REVIEW_PR_NUMBER}`,
                `${{ github.server_url }}/${{ github.repository }}/pull/${process.env.REVIEW_PR_NUMBER}`,
              );
            }
            await summary
              .addList(metadata)
              .addRaw(`\n${status}\n\n${output}\n`)
              .write();

            if (exitCode !== '0') core.setFailed(status);
