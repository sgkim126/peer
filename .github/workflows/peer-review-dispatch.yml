name: Peer Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: number
      provider:
        description: LLM provider.
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - google
          - mistral
      model:
        description: Optional model override. Leave empty to use Peer Review's default for the selected provider.
        required: false
        default: ""
        type: string
      no_resume:
        description: Start stages without resuming cached checkpoints.
        required: false
        default: false
        type: boolean
      trace:
        description: Enable peer trace logging.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PEER_VERSION: "0.13.1"

jobs:
  review:
    name: Peer review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate inputs and load pull request
        id: review
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(${{ toJSON(inputs.pr_number) }});
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('pr_number must be a positive integer.');
              return;
            }

            const provider = ${{ toJSON(inputs.provider) }};
            const defaultModels = {
              openai: 'gpt-5.6-terra',
              anthropic: 'claude-sonnet-5',
              google: 'gemini-3.6-flash',
              mistral: 'mistral-medium-latest',
            };
            if (!Object.hasOwn(defaultModels, provider)) {
              core.setFailed(`Unsupported provider: ${provider}`);
              return;
            }

            const requestedModel = (${{ toJSON(inputs.model) }} ?? '').trim();
            const model = requestedModel || defaultModels[provider];

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr-number', String(prNumber));
            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('head-sha', pull.head.sha);
            core.setOutput('title', pull.title ?? '');
            core.setOutput('provider', provider);
            core.setOutput('model', model);

      - name: Create peer review placeholder
        id: placeholder
        uses: actions/github-script@v9
        env:
          PEER_VERSION: ${{ env.PEER_VERSION }}
          REVIEW_PROVIDER: ${{ steps.review.outputs.provider }}
          REVIEW_MODEL: ${{ steps.review.outputs.model }}
        with:
          script: |
            const peerVersion = process.env.PEER_VERSION;
            const provider = process.env.REVIEW_PROVIDER;
            const model = process.env.REVIEW_MODEL;
            const triggeredBy = context.actor;
            const metadata = [
              `peer version: ${peerVersion}`,
              `provider: ${provider}`,
              `model: ${model}`,
            ].join('\n');
            const commentMetadata = [
              metadata,
              `Triggered by @${triggeredBy}`,
              `[workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.review.outputs.pr-number }}'),
              body: `${commentMetadata}\n\n⏳ peer review in progress.`,
            });

            core.setOutput('comment-id', String(comment.id));
            core.setOutput('comment-url', comment.html_url);
            core.setOutput('metadata', metadata);

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.review.outputs.pr-number }}/head
          fetch-depth: 0

      - name: Checkout peer actions
        uses: actions/checkout@v7
        with:
          repository: sgkim126/peer
          ref: main
          path: .peer-action

      - name: Prepare review context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const prNumber = Number('${{ steps.review.outputs.pr-number }}');

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const isBotComment = (comment) => comment.user?.type === 'Bot';
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const threads = [];
            for (const comment of issueComments) {
              if (isBotComment(comment)) continue;
              threads.push({ comments: [{
                author: comment.user?.login ?? 'unknown',
                body: comment.body ?? '',
              }] });
            }

            const reviewThreads = new Map();
            for (const comment of reviewComments) {
              if (isBotComment(comment)) continue;
              const root = String(comment.in_reply_to_id ?? comment.id);
              const thread = reviewThreads.get(root) ?? {
                commit: comment.commit_id,
                location: comment.path && (comment.line ?? comment.original_line)
                  ? { path: comment.path, line: comment.line ?? comment.original_line }
                  : undefined,
                comments: [],
              };
              thread.comments.push({
                author: comment.user?.login ?? 'unknown',
                body: comment.body ?? '',
              });
              reviewThreads.set(root, thread);
            }
            threads.push(...reviewThreads.values());

            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'peer-review-'));
            const bodyFile = path.join(dir, 'body.md');
            const commentsFile = path.join(dir, 'comments.json');
            fs.writeFileSync(bodyFile, pull.body ?? '');
            fs.writeFileSync(commentsFile, JSON.stringify(threads, null, 2));
            core.setOutput('body-file', bodyFile);
            core.setOutput('comments-file', commentsFile);

      - name: Run peer review
        id: peer
        uses: ./.peer-action/.github/actions/peer-review
        with:
          version: ${{ env.PEER_VERSION }}
          provider: ${{ steps.review.outputs.provider }}
          model: ${{ steps.review.outputs.model }}
          no-resume: ${{ inputs.no_resume }}
          cache-key: peer-cache-${{ runner.os }}-${{ github.repository }}-pr-${{ steps.review.outputs.pr-number }}
          target: ${{ steps.review.outputs.base-sha }}..${{ steps.review.outputs.head-sha }}
          title: ${{ steps.review.outputs.title }}
          body-file: ${{ steps.context.outputs.body-file }}
          comments-file: ${{ steps.context.outputs.comments-file }}
          trace: ${{ inputs.trace }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Prepare peer render inputs
        id: render-inputs
        uses: actions/github-script@v9
        env:
          REVIEW_JSON_PATH: ${{ steps.peer.outputs.review-json-path }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let review;
            try {
              review = JSON.parse(
                fs.readFileSync(process.env.REVIEW_JSON_PATH, 'utf8'),
              );
            } catch (error) {
              core.warning(`Could not read peer review JSON: ${error.message}`);
              return;
            }
            const inputFile = path.join(
              process.env.RUNNER_TEMP,
              'peer-render-inputs.json',
            );
            const items = [
              ...(Array.isArray(review.questions) ? review.questions : []),
              ...(Array.isArray(review.recommendations) ? review.recommendations : []),
              ...(Array.isArray(review.findings) ? review.findings : []),
            ];
            fs.writeFileSync(inputFile, JSON.stringify([review, ...items]));
            core.setOutput('input-file', inputFile);

      - name: Render peer review
        id: render
        if: always() && steps.render-inputs.outputs.input-file != ''
        uses: ./.peer-action/.github/actions/peer-render
        with:
          version: ${{ env.PEER_VERSION }}
          input-file: ${{ steps.render-inputs.outputs.input-file }}
          repo: ${{ github.repository }}

      - name: Publish peer review
        if: always() && steps.placeholder.outputs.comment-id != ''
        uses: actions/github-script@v9
        env:
          REVIEW_METADATA: ${{ steps.placeholder.outputs.metadata }}
          REVIEW_EXIT_CODE: ${{ steps.peer.outputs.exit-code }}
          REVIEW_JSON_PATH: ${{ steps.peer.outputs.review-json-path }}
          RENDER_RESULTS_PATH: ${{ steps.render.outputs.results-path }}
          REVIEW_PR_NUMBER: ${{ steps.review.outputs.pr-number }}
          REVIEW_COMMENT_ID: ${{ steps.placeholder.outputs.comment-id }}
        with:
          script: |
            const fs = require('fs');

            const readJson = (file, description) => {
              if (!file) return undefined;
              try {
                return JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (error) {
                core.warning(`Could not read ${description}: ${error.message}`);
                return undefined;
              }
            };

            const review = readJson(
              process.env.REVIEW_JSON_PATH,
              'peer review JSON',
            );
            const renderResults = readJson(
              process.env.RENDER_RESULTS_PATH,
              'peer render results',
            ) ?? [];
            const primaryRender = renderResults[0];
            const reviewExitCode = process.env.REVIEW_EXIT_CODE;
            const renderExitCode = String(primaryRender?.exit_code ?? 'unknown');
            const exitCode = reviewExitCode !== '0' ? reviewExitCode : renderExitCode;
            const metadata = exitCode === '0' ? '' : process.env.REVIEW_METADATA;
            const commentMetadata = [
              metadata,
              `Triggered by @${context.actor}`,
              `[workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].filter(Boolean).join('\n');
            let output = typeof primaryRender?.stdout === 'string'
              ? primaryRender.stdout.trim()
              : '';

            const hashesMatch = (left, right) => (
              typeof left === 'string'
              && typeof right === 'string'
              && (left.startsWith(right) || right.startsWith(left))
            );

            const resolveCommit = async (commit) => {
              const result = await exec.getExecOutput(
                'git',
                ['rev-parse', '--verify', `${commit}^{commit}`],
                { ignoreReturnCode: true, silent: true },
              );
              const resolved = result.stdout.trim();
              return result.exitCode === 0 && /^[0-9a-f]{40}$/i.test(resolved)
                ? resolved
                : undefined;
            };

            const inlineLocation = (type, item) => {
              if (type === 'finding') {
                if (
                  typeof item.commit !== 'string'
                  || typeof item.file !== 'string'
                  || item.file.length === 0
                ) {
                  return undefined;
                }
                return { commit: item.commit, path: item.file, line: item.line };
              }

              if (
                !Array.isArray(item.related_commits)
                || item.related_commits.length !== 1
                || !item.location
              ) {
                return undefined;
              }

              const commit = item.related_commits[0];
              const location = item.location;
              if (
                typeof location.file !== 'string'
                || location.file.length === 0
                || !hashesMatch(commit, location.commit)
              ) {
                return undefined;
              }
              const fullCommit = commit.length >= location.commit.length
                ? commit
                : location.commit;
              return { commit: fullCommit, path: location.file, line: location.line };
            };

            if (review && output) {
              const groups = [
                ['question', review.questions],
                ['recommendation', review.recommendations],
                ['finding', review.findings],
              ];
              let resultIndex = 1;
              for (const [type, items] of groups) {
                if (!Array.isArray(items)) continue;
                for (const item of items) {
                  const result = renderResults[resultIndex];
                  resultIndex += 1;
                  const rendered = typeof result?.stdout === 'string'
                    ? result.stdout.trim()
                    : '';
                  if (result?.exit_code !== 0 || !rendered) {
                    core.warning(`Could not render ${type}.`);
                    continue;
                  }

                  const renderedIndex = output.indexOf(rendered);
                  if (renderedIndex < 0) {
                    core.warning(`Could not locate rendered ${type} in peer review output.`);
                    continue;
                  }

                  const location = inlineLocation(type, item);
                  let commit;
                  if (location) {
                    commit = await resolveCommit(location.commit);
                    if (!commit) {
                      core.warning(
                        `Could not resolve ${type} commit ${location.commit}.`,
                      );
                    }
                  }

                  if (type === 'question' && (!location || !commit)) {
                    try {
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: Number(process.env.REVIEW_PR_NUMBER),
                        body: rendered,
                      });
                      output = [
                        output.slice(0, renderedIndex),
                        output.slice(renderedIndex + rendered.length),
                      ].join('');
                    } catch (error) {
                      core.warning(`Could not publish question: ${error.message}`);
                    }
                    continue;
                  }

                  if (!location || !commit) continue;

                  const params = {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: Number(process.env.REVIEW_PR_NUMBER),
                    body: rendered,
                    commit_id: commit,
                    path: location.path,
                  };
                  if (Number.isSafeInteger(location.line) && location.line > 0) {
                    params.subject_type = 'line';
                    params.line = location.line;
                    params.side = 'RIGHT';
                  } else {
                    params.subject_type = 'file';
                  }

                  try {
                    await github.rest.pulls.createReviewComment(params);
                    output = [
                      output.slice(0, renderedIndex),
                      output.slice(renderedIndex + rendered.length),
                    ].join('');
                  } catch (error) {
                    core.warning(
                      `Could not publish ${type} at ${location.commit}:${location.path}: ${error.message}`,
                    );
                    if (type === 'question') {
                      try {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: Number(process.env.REVIEW_PR_NUMBER),
                          body: rendered,
                        });
                        output = [
                          output.slice(0, renderedIndex),
                          output.slice(renderedIndex + rendered.length),
                        ].join('');
                      } catch (fallbackError) {
                        core.warning(
                          `Could not publish question as an issue comment: ${fallbackError.message}`,
                        );
                      }
                    }
                  }
                }
              }

              const itemHeadings = new Set([
                '## Review questions',
                '## Structural recommendations',
                '## Review findings',
              ]);
              const lines = output.split('\n');
              const sectionHasBody = (headingIndex) => {
                for (let index = headingIndex + 1; index < lines.length; index += 1) {
                  if (lines[index].startsWith('## ')) return false;
                  if (lines[index].trim() !== '') return true;
                }
                return false;
              };
              output = lines
                .filter((line, index) => (
                  !itemHeadings.has(line)
                  || sectionHasBody(index)
                ))
                .join('\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
            }

            const status = exitCode === '0'
              ? '✅ peer review completed.'
              : `❌ peer review failed (exit code: ${exitCode || 'unknown'}).`;
            const body = output
              ? `${commentMetadata}\n\n${status}\n\n${output}`
              : `${commentMetadata}\n\n${status}`;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.REVIEW_COMMENT_ID),
              body,
            });

      - name: Upload peer review stderr
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peer-review-stderr
          path: |
            ${{ steps.peer.outputs.stderr-path }}
            ${{ steps.render.outputs.stderr-path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Add peer review comment to summary
        if: always() && steps.placeholder.outputs.comment-url != ''
        uses: actions/github-script@v9
        env:
          REVIEW_METADATA: ${{ steps.placeholder.outputs.metadata }}
        with:
          script: |
            const metadata = process.env.REVIEW_METADATA;
            const metadataItems = metadata
              .split('\n')
              .filter(Boolean);
            await core.summary
              .addLink(
                'Pull request #${{ steps.review.outputs.pr-number }}',
                '${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.review.outputs.pr-number }}',
              )
              .addHeading('Peer Review')
              .addList(metadataItems)
              .addLink('View peer review comment', '${{ steps.placeholder.outputs.comment-url }}')
              .write();
