name: Peer Review Comment

on:
  workflow_call:
    inputs:
      version:
        description: Peer release version to download, with or without a leading v.
        required: true
        type: string
      provider:
        description: LLM provider name.
        required: true
        type: string
      model:
        description: LLM model name.
        required: true
        type: string
      debug:
        description: Enable peer debug logging.
        required: false
        default: false
        type: boolean
    secrets:
      MISTRAL_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    name: Peer review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check trigger
        id: trigger
        uses: actions/github-script@v9
        with:
          script: |
            const event = context.payload;
            const issue = event.issue;
            const comment = event.comment;
            const trigger = '@peer review';

            if (context.eventName !== 'issue_comment') {
              core.info(`Skipping: expected issue_comment, got ${context.eventName}.`);
              core.setOutput('should-run', 'false');
              return;
            }

            if (!issue?.pull_request) {
              core.info('Skipping: comment is not on a pull request.');
              core.setOutput('should-run', 'false');
              return;
            }

            const body = comment?.body?.trim() ?? '';
            if (!body.match(/^@peer review(?:\s|$)/)) {
              core.info('Skipping: comment body does not start with @peer review.');
              core.setOutput('should-run', 'false');
              return;
            }

            const tokens = body.slice(trigger.length).trim().split(/\s+/).filter(Boolean);
            let provider = ${{ toJSON(inputs.provider) }};
            let model = ${{ toJSON(inputs.model) }};
            let debug = ${{ toJSON(inputs.debug) }};

            for (let i = 0; i < tokens.length; i += 1) {
              const token = tokens[i];

              if (token === '--debug') {
                debug = true;
                continue;
              }

              if (token === '--provider') {
                const value = tokens[++i];
                if (!value || value.startsWith('--')) {
                  core.setFailed('Missing value for --provider.');
                  core.setOutput('should-run', 'false');
                  return;
                }
                provider = value;
                continue;
              }

              if (token === '--model') {
                const value = tokens[++i];
                if (!value || value.startsWith('--')) {
                  core.setFailed('Missing value for --model.');
                  core.setOutput('should-run', 'false');
                  return;
                }
                model = value;
                continue;
              }

              core.setFailed(`Unsupported @peer review argument: ${token}`);
              core.setOutput('should-run', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const username = comment.user.login;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const allowed = new Set(['maintain', 'admin']);

            if (!allowed.has(permission.permission)) {
              core.info(`Skipping: ${username} has ${permission.permission} permission.`);
              core.setOutput('should-run', 'false');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue.number,
            });

            core.setOutput('should-run', 'true');
            core.setOutput('pr-number', String(issue.number));
            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('title', pull.title ?? '');
            core.setOutput('provider', provider);
            core.setOutput('model', model);
            core.setOutput('debug', String(debug));

      - name: Mark peer review started
        if: steps.trigger.outputs.should-run == 'true'
        id: reaction
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: reaction } = await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

            core.setOutput('reaction-id', String(reaction.id));

      - name: Checkout pull request
        if: steps.trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.trigger.outputs.pr-number }}/head
          fetch-depth: 0

      - name: Checkout peer actions
        if: steps.trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          repository: sgkim126/peer
          ref: main
          path: .peer-action

      - name: Prepare review context
        if: steps.trigger.outputs.should-run == 'true'
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.trigger.outputs.pr-number }}');

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const threads = [];
            for (const comment of issueComments) {
              const body = comment.body ?? '';
              if (body.trim().match(/^@peer review(?:\s|$)/)) {
                continue;
              }
              if (comment.user?.login === 'github-actions[bot]') {
                continue;
              }
              threads.push({
                comments: [{
                  author: comment.user?.login ?? 'unknown',
                  body,
                }],
              });
            }

            const reviewThreads = new Map();
            for (const comment of reviewComments) {
              if (comment.user?.login === 'github-actions[bot]') {
                continue;
              }
              const root = String(comment.in_reply_to_id ?? comment.id);
              const thread = reviewThreads.get(root) ?? {
                commit: comment.commit_id,
                location: comment.path && (comment.line ?? comment.original_line)
                  ? { path: comment.path, line: comment.line ?? comment.original_line }
                  : undefined,
                comments: [],
              };
              thread.comments.push({
                author: comment.user?.login ?? 'unknown',
                body: comment.body ?? '',
              });
              reviewThreads.set(root, thread);
            }

            for (const thread of reviewThreads.values()) {
              threads.push(thread);
            }

            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'peer-review-'));
            const bodyFile = path.join(dir, 'body.md');
            const commentsFile = path.join(dir, 'comments.json');

            fs.writeFileSync(bodyFile, pull.body ?? '');
            fs.writeFileSync(commentsFile, JSON.stringify(threads, null, 2));

            core.setOutput('body-file', bodyFile);
            core.setOutput('comments-file', commentsFile);

      - name: Run peer review
        if: steps.trigger.outputs.should-run == 'true'
        id: peer
        uses: ./.peer-action/.github/actions/peer-review
        with:
          version: ${{ inputs.version }}
          provider: ${{ steps.trigger.outputs.provider }}
          model: ${{ steps.trigger.outputs.model }}
          target: ${{ steps.trigger.outputs.base-sha }}..HEAD
          repo: ${{ github.repository }}
          title: ${{ steps.trigger.outputs.title }}
          body-file: ${{ steps.context.outputs.body-file }}
          comments-file: ${{ steps.context.outputs.comments-file }}
          debug: ${{ steps.trigger.outputs.debug }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comment review result
        if: always() && steps.trigger.outputs.should-run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const bodyPath = '${{ steps.peer.outputs.stdout-path }}';
            const output = fs.readFileSync(bodyPath, 'utf8').trim();
            const metadata = [
              `provider: ${{ steps.trigger.outputs.provider }}`,
              `model: ${{ steps.trigger.outputs.model }}`,
              `[workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const body = output
              ? `${metadata}\n\n${output}`
              : `${metadata}\n\npeer review completed without output.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.trigger.outputs.pr-number }}'),
              body,
            });

      - name: Update peer review reaction
        if: always() && steps.trigger.outputs.should-run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const commentId = context.payload.comment.id;
            const reactionId = '${{ steps.reaction.outputs.reaction-id }}';

            if (reactionId) {
              try {
                await github.rest.reactions.deleteForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  reaction_id: Number(reactionId),
                });
              } catch (error) {
                core.warning(`Failed to delete eyes reaction: ${error.message}`);
              }
            }

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commentId,
              content: '${{ steps.peer.outputs.exit-code }}' === '0' ? 'rocket' : 'confused',
            });

      - name: Fail if peer review failed
        if: always() && steps.trigger.outputs.should-run == 'true' && steps.peer.outputs.exit-code != '0'
        run: exit "${{ steps.peer.outputs.exit-code }}"
