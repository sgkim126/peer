name: Peer Render
description: Publish a peer review JSON document to a GitHub pull request.

inputs:
  version:
    description: Peer release version to download, with or without a leading v.
    required: true
  input-file:
    description: Path to the peer review JSON document to publish.
    required: true
  repo:
    description: GitHub repository name in owner/name form.
    required: true
  pr-number:
    description: GitHub pull request number to publish the review to.
    required: true

outputs:
  exit-code:
    description: Exit code returned by peer render.
    value: ${{ steps.render.outputs.exit-code }}
  stdout-path:
    description: Path to the peer render stdout file on the runner.
    value: ${{ steps.render.outputs.stdout-path }}
  stderr-path:
    description: Path to the peer render stderr file on the runner.
    value: ${{ steps.render.outputs.stderr-path }}

runs:
  using: composite
  steps:
    - name: Install peer binary
      shell: bash
      env:
        PEER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="${PEER_VERSION#v}"
        tag="v$version"

        if command -v peer > /dev/null 2>&1 &&
          [ "$(peer --version 2> /dev/null)" = "peer $version" ]; then
          exit 0
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}. peer-render supports Linux-X64 only." >&2
            exit 2
            ;;
        esac

        archive="peer-linux-x86_64-${version}.tar.gz"
        install_dir="$RUNNER_TEMP/peer-bin"

        mkdir -p "$install_dir"
        curl --fail --location --show-error --silent \
          "https://github.com/sgkim126/peer/releases/download/${tag}/${archive}" \
          --output "$RUNNER_TEMP/$archive"

        tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir"
        chmod +x "$install_dir/peer"

        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Render peer output
      id: render
      shell: bash
      env:
        PEER_RENDER_INPUT_FILE: ${{ inputs.input-file }}
        PEER_RENDER_REPO: ${{ inputs.repo }}
        PEER_RENDER_PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail

        stdout="$RUNNER_TEMP/peer-render-stdout.log"
        stderr="$RUNNER_TEMP/peer-render-stderr.log"

        {
          echo "### peer render command"
          echo
          echo '```bash'
          printf 'peer render --format github --repo %q --github %q < %q\n' \
            "$PEER_RENDER_REPO" "$PEER_RENDER_PR_NUMBER" "$PEER_RENDER_INPUT_FILE"
          echo '```'
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        set +e
        peer render --format github --repo "$PEER_RENDER_REPO" \
          --github "$PEER_RENDER_PR_NUMBER" \
          > "$stdout" \
          2> >(tee "$stderr" >&2) \
          < "$PEER_RENDER_INPUT_FILE"
        code=$?
        set -e

        cat "$stdout"

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "stdout-path=$stdout" >> "$GITHUB_OUTPUT"
        echo "stderr-path=$stderr" >> "$GITHUB_OUTPUT"
