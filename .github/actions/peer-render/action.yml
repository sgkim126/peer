name: Peer Render
description: Render an array of peer JSON values for GitHub.

inputs:
  version:
    description: Peer release version to download, with or without a leading v.
    required: true
  input-file:
    description: Path to a JSON array containing peer values to render.
    required: true
  repo:
    description: GitHub repository name in owner/name form for output links.
    required: true

outputs:
  results-path:
    description: Path to the JSON array containing render exit codes and outputs.
    value: ${{ steps.render.outputs.results-path }}
  stderr-path:
    description: Path to the combined peer render stderr file on the runner.
    value: ${{ steps.render.outputs.stderr-path }}

runs:
  using: composite
  steps:
    - name: Install peer binary
      shell: bash
      env:
        PEER_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        version="${PEER_VERSION#v}"
        tag="v$version"

        if command -v peer > /dev/null 2>&1 &&
          [ "$(peer --version 2> /dev/null)" = "peer $version" ]; then
          exit 0
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}. peer-render supports Linux-X64 only." >&2
            exit 2
            ;;
        esac

        archive="peer-linux-x86_64-${version}.tar.gz"
        install_dir="$RUNNER_TEMP/peer-bin"

        mkdir -p "$install_dir"
        release_json="$RUNNER_TEMP/peer-release-${tag}.json"
        curl --fail --location --show-error --silent \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/sgkim126/peer/releases/tags/${tag}" \
          --output "$release_json"

        asset_url="$(
          jq -r --arg archive "$archive" '.assets[] | select(.name == $archive) | .url' "$release_json"
        )"
        if [ -z "$asset_url" ]; then
          echo "Release asset not found: ${archive}" >&2
          exit 2
        fi

        curl --fail --location --show-error --silent \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "Accept: application/octet-stream" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "$asset_url" \
          --output "$RUNNER_TEMP/$archive"

        tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir"
        chmod +x "$install_dir/peer"

        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Render peer output
      id: render
      shell: bash
      env:
        PEER_RENDER_INPUT_FILE: ${{ inputs.input-file }}
        PEER_RENDER_REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail

        results="$RUNNER_TEMP/peer-render-results.json"
        results_tmp="$RUNNER_TEMP/peer-render-results.tmp.json"
        stderr="$RUNNER_TEMP/peer-render-stderr.log"
        printf '[]\n' > "$results"
        : > "$stderr"

        {
          echo "### peer render command"
          echo
          echo '```bash'
          printf 'peer render --format github --repo %q < each(%q)\n' \
            "$PEER_RENDER_REPO" "$PEER_RENDER_INPUT_FILE"
          echo '```'
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if ! jq --exit-status 'type == "array"' "$PEER_RENDER_INPUT_FILE" > /dev/null; then
          echo "Peer render input must be a JSON array." | tee -a "$stderr" >&2
          echo "results-path=$results" >> "$GITHUB_OUTPUT"
          echo "stderr-path=$stderr" >> "$GITHUB_OUTPUT"
          exit 2
        else
          count="$(jq 'length' "$PEER_RENDER_INPUT_FILE")"
          for ((index = 0; index < count; index++)); do
            item="$RUNNER_TEMP/peer-render-input-$index.json"
            jq --compact-output ".[$index]" "$PEER_RENDER_INPUT_FILE" > "$item"

            set +e
            output="$(
              peer render --format github --repo "$PEER_RENDER_REPO" \
                < "$item" \
                2> >(tee -a "$stderr" >&2)
            )"
            code=$?
            set -e

            jq \
              --argjson exit_code "$code" \
              --arg stdout "$output" \
              '. + [{ exit_code: $exit_code, stdout: $stdout }]' \
              "$results" > "$results_tmp"
            mv "$results_tmp" "$results"

            if [ -n "$output" ]; then
              printf '%s\n' "$output"
            fi
          done
        fi

        echo "results-path=$results" >> "$GITHUB_OUTPUT"
        echo "stderr-path=$stderr" >> "$GITHUB_OUTPUT"
