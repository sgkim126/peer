name: Peer Review
description: Run peer init if needed, then produce a peer review JSON document.

inputs:
  version:
    description: Peer release version to download, with or without a leading v.
    required: true
  provider:
    description: LLM provider name. Supported values match resources/default_config.toml.
    required: false
  model:
    description: LLM model name to pass to peer review.
    required: false
  no-resume:
    description: Start stages without resuming cached checkpoints.
    required: false
    default: "false"
  cache-key:
    description: Cache key for peer's review cache. Leave empty to disable caching.
    required: false
    default: ""
  pr-number:
    description: GitHub pull request number to review.
    required: true
  repo:
    description: GitHub repository name in owner/name form.
    required: true
  trace:
    description: Enable peer trace logging.
    required: false
    default: "false"
outputs:
  exit-code:
    description: Exit code returned by peer review.
    value: ${{ steps.review.outputs.exit-code }}
  review-json-path:
    description: Path to the peer review JSON file on the runner.
    value: ${{ steps.review.outputs.review-json-path }}
  stderr-path:
    description: Path to the peer review stderr file on the runner.
    value: ${{ steps.review.outputs.stderr-path }}

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install Pi
      shell: bash
      run: |
        set -euo pipefail

        npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
        pi --version

    - name: Install peer binary
      shell: bash
      env:
        PEER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="${PEER_VERSION#v}"
        tag="v$version"

        if command -v peer > /dev/null 2>&1 &&
          [ "$(peer --version 2> /dev/null)" = "peer $version" ]; then
          exit 0
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}. peer-review supports Linux-X64 only." >&2
            exit 2
            ;;
        esac

        archive="peer-linux-x86_64-${version}.tar.gz"
        install_dir="$RUNNER_TEMP/peer-bin"

        mkdir -p "$install_dir"
        curl --fail --location --show-error --silent \
          "https://github.com/sgkim126/peer/releases/download/${tag}/${archive}" \
          --output "$RUNNER_TEMP/$archive"

        tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir"
        chmod +x "$install_dir/peer"

        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Initialize peer config
      shell: bash
      env:
        PEER_REVIEW_REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail

        if [ ! -d .peer ]; then
          peer init --repo "$PEER_REVIEW_REPO"
        fi

        mkdir -p .peer/cache

    - name: Restore peer cache
      if: inputs.cache-key != ''
      uses: actions/cache@v6
      with:
        path: .peer/cache
        key: ${{ inputs.cache-key }}

    - name: Run peer review
      id: review
      shell: bash
      env:
        PEER_REVIEW_PROVIDER: ${{ inputs.provider }}
        PEER_REVIEW_MODEL: ${{ inputs.model }}
        PEER_REVIEW_NO_RESUME: ${{ inputs.no-resume }}
        PEER_REVIEW_PR_NUMBER: ${{ inputs.pr-number }}
        PEER_REVIEW_REPO: ${{ inputs.repo }}
        PEER_REVIEW_TRACE: ${{ inputs.trace }}
      run: |
        set -euo pipefail

        if [ -n "$PEER_REVIEW_PROVIDER" ]; then
          case "$PEER_REVIEW_PROVIDER" in
            mistral) api_key_env="MISTRAL_API_KEY" ;;
            openai) api_key_env="OPENAI_API_KEY" ;;
            anthropic) api_key_env="ANTHROPIC_API_KEY" ;;
            google) api_key_env="GEMINI_API_KEY" ;;
            *)
              echo "Unsupported provider: $PEER_REVIEW_PROVIDER" >&2
              exit 2
              ;;
          esac

          if [ -z "${!api_key_env:-}" ]; then
            echo "Required environment variable is missing or empty: $api_key_env" >&2
            exit 2
          fi
        fi

        review_json="$RUNNER_TEMP/peer-review.json"
        stderr="$RUNNER_TEMP/peer-review-stderr.log"
        args=(
          review --github "$PEER_REVIEW_PR_NUMBER" --repo "$PEER_REVIEW_REPO"
        )

        if [ -n "$PEER_REVIEW_PROVIDER" ]; then
          args+=(--provider "$PEER_REVIEW_PROVIDER")
        fi
        if [ -n "$PEER_REVIEW_MODEL" ]; then
          args+=(--model "$PEER_REVIEW_MODEL")
        fi
        if [ "$PEER_REVIEW_NO_RESUME" = "true" ]; then
          args+=(--no-resume)
        fi
        if [ "$PEER_REVIEW_TRACE" = "true" ]; then
          export RUST_LOG=trace
        fi
        {
          echo "### peer review command"
          echo
          echo '```bash'
          printf 'peer'
          printf ' %q' "${args[@]}"
          printf '\n'
          echo '```'
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        set +e
        peer "${args[@]}" \
          > "$review_json" \
          2> >(tee "$stderr" >&2)
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "review-json-path=$review_json" >> "$GITHUB_OUTPUT"
        echo "stderr-path=$stderr" >> "$GITHUB_OUTPUT"
