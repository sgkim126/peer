name: Peer Review
description: Run peer init if needed, then run peer review.

inputs:
  version:
    description: Peer release version to download, with or without a leading v.
    required: true
  provider:
    description: LLM provider name. Supported values match resources/default_config.toml.
    required: false
  model:
    description: LLM model name to pass to peer review.
    required: false
  skip-checks:
    description: Comma-separated checks to skip.
    required: false
    default: ""
  only-checks:
    description: Comma-separated checks to run exclusively.
    required: false
    default: ""
  cache-key:
    description: Cache key for peer's review cache. Leave empty to disable caching.
    required: false
    default: ""
  target:
    description: Git revision or range to review.
    required: true
  repo:
    description: GitHub repository name in owner/name form for GitHub output links.
    required: true
  title:
    description: Pull request title to pass to peer review.
    required: false
    default: ""
  body-file:
    description: Path to a file containing the pull request body.
    required: false
    default: ""
  comments-file:
    description: Path to a JSON file containing review comment threads.
    required: false
    default: ""
  debug:
    description: Enable peer debug logging.
    required: false
    default: "false"
  verbose:
    description: Enable peer verbose logging.
    required: false
    default: "false"

outputs:
  exit-code:
    description: Exit code returned by peer review.
    value: ${{ steps.review.outputs.exit-code }}
  stdout-path:
    description: Path to the peer review stdout file on the runner.
    value: ${{ steps.review.outputs.stdout-path }}
  stderr-path:
    description: Path to the peer review stderr file on the runner.
    value: ${{ steps.review.outputs.stderr-path }}

runs:
  using: composite
  steps:
    - name: Install peer binary
      shell: bash
      env:
        PEER_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        version="${PEER_VERSION#v}"
        tag="v$version"

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}. peer-review supports Linux-X64 only." >&2
            exit 2
            ;;
        esac

        archive="peer-linux-x86_64-${version}.tar.gz"
        install_dir="$RUNNER_TEMP/peer-bin"

        mkdir -p "$install_dir"
        release_json="$RUNNER_TEMP/peer-release-${tag}.json"
        curl --fail --location --show-error --silent \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/sgkim126/peer/releases/tags/${tag}" \
          --output "$release_json"

        asset_url="$(
          jq -r --arg archive "$archive" '.assets[] | select(.name == $archive) | .url' "$release_json"
        )"
        if [ -z "$asset_url" ]; then
          echo "Release asset not found: ${archive}" >&2
          exit 2
        fi

        curl --fail --location --show-error --silent \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "Accept: application/octet-stream" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "$asset_url" \
          --output "$RUNNER_TEMP/$archive"

        tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir"
        chmod +x "$install_dir/peer"

        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Initialize peer config
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -d .peer ]; then
          peer init
        fi

        mkdir -p .peer/cache

    - name: Restore peer cache
      if: inputs.cache-key != ''
      uses: actions/cache@v6
      with:
        path: .peer/cache
        key: ${{ inputs.cache-key }}

    - name: Run peer review
      id: review
      shell: bash
      env:
        PEER_REVIEW_PROVIDER: ${{ inputs.provider }}
        PEER_REVIEW_MODEL: ${{ inputs.model }}
        PEER_REVIEW_SKIP_CHECKS: ${{ inputs.skip-checks }}
        PEER_REVIEW_ONLY_CHECKS: ${{ inputs.only-checks }}
        PEER_REVIEW_TARGET: ${{ inputs.target }}
        PEER_REVIEW_REPO: ${{ inputs.repo }}
        PEER_REVIEW_TITLE: ${{ inputs.title }}
        PEER_REVIEW_BODY_FILE: ${{ inputs.body-file }}
        PEER_REVIEW_COMMENTS_FILE: ${{ inputs.comments-file }}
        PEER_REVIEW_DEBUG: ${{ inputs.debug }}
        PEER_REVIEW_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -euo pipefail

        if [ -n "$PEER_REVIEW_PROVIDER" ]; then
          case "$PEER_REVIEW_PROVIDER" in
            mistral) api_key_env="MISTRAL_API_KEY" ;;
            openai) api_key_env="OPENAI_API_KEY" ;;
            anthropic) api_key_env="ANTHROPIC_API_KEY" ;;
            gemini) api_key_env="GEMINI_API_KEY" ;;
            *)
              echo "Unsupported provider: $PEER_REVIEW_PROVIDER" >&2
              exit 2
              ;;
          esac

          if [ -z "${!api_key_env:-}" ]; then
            echo "Required environment variable is missing or empty: $api_key_env" >&2
            exit 2
          fi
        fi

        stdout="$RUNNER_TEMP/peer-review-stdout.md"
        stderr="$RUNNER_TEMP/peer-review-stderr.log"
        args=(
          review "$PEER_REVIEW_TARGET"
          --format github
          --repo "$PEER_REVIEW_REPO"
        )

        if [ -n "$PEER_REVIEW_PROVIDER" ]; then
          args+=(--provider "$PEER_REVIEW_PROVIDER")
        fi
        if [ -n "$PEER_REVIEW_MODEL" ]; then
          args+=(--model "$PEER_REVIEW_MODEL")
        fi
        if [ -n "$PEER_REVIEW_SKIP_CHECKS" ] && [ -n "$PEER_REVIEW_ONLY_CHECKS" ]; then
          echo 'Only one of skip-checks or only-checks may be specified.' >&2
          exit 2
        fi
        if [ -n "$PEER_REVIEW_SKIP_CHECKS" ]; then
          args+=(--skip-check "$PEER_REVIEW_SKIP_CHECKS")
        fi
        if [ -n "$PEER_REVIEW_ONLY_CHECKS" ]; then
          args+=(--only-check "$PEER_REVIEW_ONLY_CHECKS")
        fi
        if [ "$PEER_REVIEW_DEBUG" = "true" ]; then
          args=(--debug "${args[@]}")
        fi
        if [ "$PEER_REVIEW_VERBOSE" = "true" ]; then
          args=(--verbose "${args[@]}")
        fi
        if [ -n "$PEER_REVIEW_TITLE" ]; then
          args+=(--title "$PEER_REVIEW_TITLE")
        fi
        if [ -n "$PEER_REVIEW_BODY_FILE" ]; then
          args+=(--body-file "$PEER_REVIEW_BODY_FILE")
        fi
        if [ -n "$PEER_REVIEW_COMMENTS_FILE" ]; then
          args+=(--comments-file "$PEER_REVIEW_COMMENTS_FILE")
        fi

        {
          echo "### peer review command"
          echo
          echo '```bash'
          printf 'peer'
          printf ' %q' "${args[@]}"
          printf '\n'
          echo '```'
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        set +e
        peer "${args[@]}" >"$stdout" 2>"$stderr"
        code=$?
        set -e

        {
          echo "### peer review stderr"
          echo
          echo '```text'
          cat "$stderr"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "stdout-path=$stdout" >> "$GITHUB_OUTPUT"
        echo "stderr-path=$stderr" >> "$GITHUB_OUTPUT"
