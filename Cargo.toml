[package]
name = "peer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process"] }
toml = "1.1.2"
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
tempfile = "3.27"
