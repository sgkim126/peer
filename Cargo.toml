[package]
name = "peer"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
owo-colors = "4.3.0"
blake3 = "1"
semver = "1"

[dev-dependencies]
tempfile = "3.9"
